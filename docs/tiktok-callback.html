<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>TikTok connected</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <h1 id="h">Connecting TikTok…</h1>
  <p id="msg"></p>
  <pre id="code" hidden></pre>
  <p class="muted">This page only shows the code TikTok sent back to it. It sends nothing anywhere and stores nothing.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), err = q.get('error');
  if (code) {
    document.getElementById('h').textContent = 'TikTok connected';
    document.getElementById('msg').textContent = 'Copy this code and paste it after TIKTOK_AUTH_CODE= in the .env file (it works for a few minutes only):';
    const pre = document.getElementById('code');
    pre.textContent = code; pre.hidden = false;
  } else {
    document.getElementById('h').textContent = err ? 'TikTok did not connect' : 'Nothing to show';
    document.getElementById('msg').textContent = err ? `${err}: ${q.get('error_description') || ''}` : 'Open this page through the TikTok login link.';
  }
</script>
</body>
</html>
