name: Long Bhajan Week Upload

on:
  schedule:
    - cron: '15 20 14 5 *'   # May 14 (Wed) 8:15pm UTC = 2:00am Nepal
    - cron: '15 20 15 5 *'   # May 15 (Thu)
    - cron: '15 20 16 5 *'   # May 16 (Fri)
    - cron: '15 20 17 5 *'   # May 17 (Sat)
    - cron: '15 20 18 5 *'   # May 18 (Sun)
    - cron: '15 20 19 5 *'   # May 19 (Mon)
    - cron: '15 20 20 5 *'   # May 20 (Tue)
  workflow_dispatch:

jobs:
  upload-long-bhajan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip

      - name: Upload long bhajan to SUNYAMusic (YouTube)
        env:
          YOUTUBE_CLIENT_ID:           ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:       ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_MUSIC_REFRESH_TOKEN: ${{ secrets.YOUTUBE_MUSIC_REFRESH_TOKEN }}
        run: python3 sunya-music/scripts/upload_long_bhajan.py
