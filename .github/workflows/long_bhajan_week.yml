name: Long Bhajan Week Upload

on:
  schedule:
    - cron: '16 22 13 5 *'   # May 13 (Tue) 10:16pm UTC = 4:01am Nepal
    - cron: '16 22 14 5 *'   # May 14 (Wed)
    - cron: '16 22 15 5 *'   # May 15 (Thu)
    - cron: '16 22 16 5 *'   # May 16 (Fri)
    - cron: '16 22 17 5 *'   # May 17 (Sat)
    - cron: '16 22 18 5 *'   # May 18 (Sun)
    - cron: '16 22 19 5 *'   # May 19 (Mon)
  workflow_dispatch:

jobs:
  upload-long-bhajan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip

      - name: Upload long bhajan to SUNYAMusic (YouTube)
        env:
          YOUTUBE_CLIENT_ID:           ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:       ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_MUSIC_REFRESH_TOKEN: ${{ secrets.YOUTUBE_MUSIC_REFRESH_TOKEN }}
        run: python3 sunya-music/scripts/upload_long_bhajan.py
