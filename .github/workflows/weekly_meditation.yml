name: Weekly Meditation Upload

on:
  schedule:
    - cron: '15 22 * * 0'   # every Sunday at 10:15pm UTC = 4:00am Nepal time
  workflow_dispatch:

jobs:
  upload-meditation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip

      - name: Upload meditation video to SUNYAMusic (YouTube)
        env:
          YOUTUBE_CLIENT_ID:           ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:       ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_MUSIC_REFRESH_TOKEN: ${{ secrets.YOUTUBE_MUSIC_REFRESH_TOKEN }}
        run: python3 sunya-music/scripts/upload_meditation.py
