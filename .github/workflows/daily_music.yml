name: Daily Music Upload

on:
  schedule:
    - cron: '15 22 * * *'   # every day at 10:15pm UTC = 4:00am Nepal time
  workflow_dispatch:

jobs:
  upload-music:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip

      - name: Upload music to SUNYAMusic (YouTube)
        env:
          YOUTUBE_CLIENT_ID:            ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:        ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_MUSIC_REFRESH_TOKEN:  ${{ secrets.YOUTUBE_MUSIC_REFRESH_TOKEN }}
        run: python3 sunya-music/scripts/upload_music.py

      - name: Upload music to Facebook
        env:
          FACEBOOK_MUSIC_PAGE_TOKEN: ${{ secrets.FACEBOOK_MUSIC_PAGE_TOKEN }}
          FACEBOOK_MUSIC_PAGE_ID:    ${{ secrets.FACEBOOK_MUSIC_PAGE_ID }}
          FACEBOOK_APP_ID:           ${{ secrets.FACEBOOK_APP_ID }}
        run: python3 sunya-music/scripts/upload_facebook.py
