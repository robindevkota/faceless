name: Nepali Songs Upload

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-nepali:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip

      - name: Upload Nepali song to SUNYAMusic (YouTube)
        env:
          YOUTUBE_CLIENT_ID:           ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:       ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_MUSIC_REFRESH_TOKEN: ${{ secrets.YOUTUBE_MUSIC_REFRESH_TOKEN }}
        run: python3 sunya-music/scripts/upload_nepali.py
